server {
    listen 80;
    server_name runway.dallag.com;

    location / {
        proxy_pass http://web:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name api.runway.dallag.com;

    location / {
        proxy_pass http://api:3001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
